  const [error, setError] = useState(false);

  function handleChange(e) {
    const { name, value } = e.target;
    setForm((f) => ({ ...f, [name]: value }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setEnviando(true);
    setError(false);
    try {
      const res = await fetch("https://formspree.io/f/EDUCACCION_FORM_ID", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(e.target),
      });
      if (res.ok) {
        setEnviado(true);
      } else {
        setError(true);
      }
    } catch (err) {
      setError(true);
    } finally {
      setEnviando(false);
    }
  }

          </h1>
          <p className="hero-tagline">
            EducAcción Corp. es una organización sin fines de lucro de base
            comunitaria comprometida con transformar las comunidades de Puerto

      <section className="section" id="nosotros">

            <div className="section-eyebrow">Quiénes somos</div>
            <h2>Educación, alfabetización y acción ciudadana</h2>

              Aspiramos a ser una organización líder en Puerto Rico en la
              transformación social y comunitaria, reconocida por movilizar la
              acción colectiva, impulsar la educación como herramienta de
              empoderamiento y facilitar el acceso equitativo a servicios
              esenciales con impacto en la salud.
            </p>
          </div>

          <div className="pilares">
            <div className="pilar">
              <h3>Misión</h3>
              <p>
                Contribuir al fortalecimiento de las comunidades en Puerto
                Rico mediante la acción comunitaria, la alfabetización, la
                educación y la capacitación adaptadas a las realidades de las
                diversas poblaciones del país.
              </p>
            </div>
            <div className="pilar">
              <h3>Propósito</h3>
              <p>
                Promovemos la conciencia y la participación ciudadana en
                temas de salud, política pública y política partidista,
                brindando herramientas educativas claras que fortalezcan la
                acción comunitaria y democrática.

            <div className="pilar">

              </p>
            </div>
          </div>

          <div className="valores-grid">

          ))}

                comunitario, coordinamos asistencia voluntaria para mejorar

                seguridad a su hogar.
              </p>
            </div>

            <div className="impacto-list">
              <div className="impacto-item">
                <h3>Asistencia a personas en situación de desventaja</h3>
                <p>
                  Brindamos apoyo directo a personas en comunidades
                  vulnerables, identificando necesidades básicas insatisfechas
                  y coordinando respuestas voluntarias oportunas.
                </p>
              </div>
              <div className="impacto-item">
                <h3>Reparaciones del hogar</h3>
                <p>
                  Plomería, electricidad y reparaciones estructurales
                  menores, realizadas por voluntarios como complemento a la
                  asistencia oficial existente.
                </p>
              </div>
              <div className="impacto-item">
                <h3>Carácter voluntario y complementario</h3>

            </div>

            <div className="tl-row">

                <span>

                  gobierno sobre el estado del TDAH y los servicios

              </div>

            <div className="tl-row">
              <span className="tl-dot" />

                  Petición para la radicación de la "Carta de Derechos para

            </div>

              alianza o hacer una consulta.
            </p>

                  <input type="hidden" name="_replyto" value={form.correo} />
                  <input type="hidden" name="_subject" value="Nuevo mensaje desde EducAcción Corp." />
                  <div className="field">
                    <label htmlFor="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Tu nombre"
                      value={form.nombre} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="tucorreo@ejemplo.com"
                      value={form.correo} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="organizacion">Organización (opcional)</label>
                    <input id="organizacion" name="organizacion" type="text" placeholder="Nombre de tu escuela u organización"

                      <option>Consulta general</option>
