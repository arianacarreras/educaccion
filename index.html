                  seguridad a su hogar.
                </p>
              </div>
            </div>

            <div className="impacto-list">
              <div className="impacto-item">
                <h3>Asistencia a personas en situación de vulnerabilidad</h3>
                <p>
                  Hemos ofrecido asistencia a personas en situación de
                  vulnerabilidad, identificando necesidades básicas insatisfechas
                  y coordinando respuestas voluntarias oportunas.
                </p>
              </div>
              <div className="impacto-item">
                <h3>Carácter voluntario y complementario</h3>
                <p>
                  Todo nuestro trabajo comunitario es voluntario y no
                  sustituye la información ni la asistencia oficial provista
                  por las agencias gubernamentales correspondientes.
                </p>
              </div>
            </div>
          </div>

          <div className="comunidad-gallery">
            <div className="gallery-item">
              <img className="gallery-photo" src={`data:image/jpeg;base64,${MIRTA_PORTRAIT_B64}`} alt="Doña Mirta en su hogar" />
              <div className="gallery-caption">Doña Mirta, en su hogar</div>
            </div>
            <div className="gallery-item">
              <img className="gallery-photo" src={`data:image/jpeg;base64,${ASISTENCIA_B64}`} alt="Entrega de asistencia comunitaria" />
              <div className="gallery-caption">Entrega de asistencia comunitaria</div>
            </div>
          </div>
        </div>
      </section>

      {/* INCIDENCIA LEGISLATIVA */}
      <section className="section" id="incidencia" style={{ background: "var(--white)" }}>
        <div className="container">
          <div className="section-head">
            <div className="section-eyebrow">Incidencia pública</div>
            <h2>Participación en política pública</h2>
            <p>Así hemos participado en procesos de política pública relacionados a nuestra misión.</p>
          </div>

          <div className="timeline">
            <div className="tl-row">
              <span className="tl-dot"><IconDocument /></span>
              <div className="tl-text">
                <strong>Petición de información</strong>
                <span>
                  Solicitud de datos e información pública a agencias de
                  gobierno sobre el estado del TDAH y los servicios
                  disponibles en Puerto Rico.
                </span>
              </div>
            </div>
            <div className="tl-row">
              <span className="tl-dot"><IconScroll /></span>
              <div className="tl-text">
                <strong>Radicación de medidas</strong>
                <span>Pronto se estará anunciando.</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* CONTACTO */}
      <section className="contacto" id="contacto">
        <div className="leaf leaf-outline" style={{ width: 200, height: 200, top: -80, right: -80, opacity: 0.15 }} />
        <div className="container">
          <div className="section-head">
            <div className="section-eyebrow">Conversemos</div>
            <h2>Colabora con nosotros</h2>
            <p>
              Completa el formulario para solicitar un taller, proponer una
              alianza o hacer una consulta.
            </p>
          </div>

          <div className="contacto-grid">
            <div>
              {enviado ? (
                <div className="confirm">
                  <strong>Gracias por escribir</strong>
                  Recibimos tu mensaje y te contactaremos lo antes posible
                  para conversar sobre {form.motivo.toLowerCase()}.
                </div>
              ) : (
                <form onSubmit={handleSubmit}>
                  <input type="hidden" name="_replyto" value={form.correo} />
                  <input type="hidden" name="_subject" value="Nuevo mensaje desde EducAcción Corp." />
                  <div className="field">
                    <label htmlFor="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Tu nombre"
                      value={form.nombre} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="tucorreo@ejemplo.com"
                      value={form.correo} onChange={handleChange} required />
                  </div>
                  <div className="field">
                    <label htmlFor="organizacion">Organización (opcional)</label>
                    <input id="organizacion" name="organizacion" type="text" placeholder="Nombre de tu escuela u organización"
                      value={form.organizacion} onChange={handleChange} />
                  </div>
                  <div className="field">
                    <label htmlFor="motivo">Motivo</label>
                    <select id="motivo" name="motivo" value={form.motivo} onChange={handleChange}>
                      <option>Solicitar un taller</option>
                      <option>Proponer una alianza</option>
                      <option>Donación o colaboración</option>
                      <option>Consulta general</option>
                    </select>
                  </div>
                  <div className="field">
                    <label htmlFor="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Cuéntanos un poco más..."
                      value={form.mensaje} onChange={handleChange} required />
                  </div>
                  <button className="submit-btn" type="submit" disabled={enviando}>
                    {enviando ? "Enviando..." : "Enviar mensaje"}
                  </button>
                  {error && (
                    <p className="form-error">
                      No se pudo enviar el mensaje. Intenta de nuevo en unos minutos.
                    </p>
                  )}
                </form>
              )}
            </div>

            <div className="colaborar">
              <h3>Apoya nuestra labor</h3>
              <p>
                Se aceptan donaciones para fortalecer los talleres, materiales
                y el trabajo comunitario que hacemos junto a las familias de
                Puerto Rico.
              </p>
              <a className="btn btn-donar" href="#">Donar</a>
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="footer">
        <div className="container footer-row">
          <div className="footer-note">
            <strong>EducAcción Corp.</strong> · Puerto Rico
            <br />
            Presidenta: Ariana Carreras Espinosa
          </div>
          <div className="footer-contact">
            <a href={`mailto:${CONTACT_EMAIL}`}>{CONTACT_EMAIL}</a>
            <a className="footer-social" href={INSTAGRAM_URL} target="_blank" rel="noreferrer">
              <span className="footer-social-icon" aria-hidden="true"><IconInstagram /></span>
              @{SOCIAL_HANDLE}
            </a>
          </div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EducAccionCorp />);
</script>
</body>
</html>
